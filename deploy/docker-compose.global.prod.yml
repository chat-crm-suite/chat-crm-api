# Compose GLOBAL de producción — ~/Proyectos/CRM/docker-compose.yml
# Cómo usarlo en el servidor (tú lo ejecutas):
#   cd ~/Proyectos/CRM
#   cp chat-crm-api/.env.prod.example chat-crm-api/.env.prod   # solo 1ra vez
#   nano chat-crm-api/.env.prod                                # rellena secretos + CORS=http://<TU_DOMINIO>:8003
#   cp chat-crm-app/.env.prod.example chat-crm-app/.env.prod   # solo 1ra vez
#   nano chat-crm-app/.env.prod                                # VITE_API_URL=http://<TU_DOMINIO>:8002 VITE_SOCKET_URL=<base sin namespace> APP_PORT=8003
#   cp chat-crm-api/deploy/docker-compose.global.prod.yml docker-compose.yml  # o respalda antes: cp docker-compose.yml docker-compose.yml.bak-dev
#   docker compose up --build -d
#   curl -s http://localhost:8002/health && curl -s http://localhost:8003/health
#
# Puertos públicos (dyndns): API 8002, front 8003. MySQL/Redis NO expuestos. phpMyAdmin solo tools en 127.0.0.1:7120.
name: chat-crm

services:
  api:
    build:
      context: ./chat-crm-api
      dockerfile: Dockerfile
      target: production
    container_name: chat-crm-api
    env_file:
      - ./chat-crm-api/.env.prod
    environment:
      - NODE_ENV=production
    ports:
      - "8002:3000"
    volumes:
      - chat-crm-uploads-data:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - chat-crm-network
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: chat-crm-mysql
    env_file:
      - ./chat-crm-api/.env.prod
    # Sin ports: solo red interna. Sin bind de database/init en prod.
    volumes:
      - chat-crm-mysql-data:/var/lib/mysql
    networks:
      - chat-crm-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      timeout: 20s
      retries: 10
      interval: 10s
      start_period: 40s

  redis:
    image: redis:7-alpine
    container_name: chat-crm-redis
    env_file:
      - ./chat-crm-api/.env.prod
    volumes:
      - chat-crm-redis-data:/data
    networks:
      - chat-crm-network
    restart: unless-stopped
    command: >
      sh -c "
      if [ -n \"$$REDIS_PASSWORD\" ]; then
        exec redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes
      else
        exec redis-server --appendonly yes
      fi
      "
    healthcheck:
      test: ["CMD-SHELL", "if [ -z \"$$REDIS_PASSWORD\" ]; then redis-cli ping | grep PONG; else redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG; fi"]
      timeout: 3s
      retries: 5
      interval: 10s
      start_period: 10s

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: chat-crm-phpmyadmin
    profiles: ["tools"]
    ports:
      - "127.0.0.1:7120:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - chat-crm-network
    restart: unless-stopped

  app:
    build:
      context: ./chat-crm-app
      dockerfile: Dockerfile
      target: production
      # Shared contracts: single source of truth lives in the API repo.
      # Both checkouts are siblings on the server.
      additional_contexts:
        contracts: ./chat-crm-api/src/contracts
      args:
        VITE_API_URL: http://<TU_DOMINIO>:8002
        VITE_SOCKET_URL: http://<TU_DOMINIO>:8002
    container_name: chat-crm-app
    ports:
      - "8003:80"
    networks:
      - chat-crm-network
    restart: unless-stopped

  # IA (opcional): solo arranca con --profile ia y cuando exista la carpeta.
  #   mkdir -p chat-crm-ia && docker compose --profile ia up --build -d
  ia:
    build:
      context: ./chat-crm-ia
      dockerfile: Dockerfile
      target: production
    container_name: chat-crm-ia
    profiles: ["ia"]
    ports:
      - "8000:8000"
    networks:
      - chat-crm-network
    restart: unless-stopped

volumes:
  chat-crm-mysql-data:
    name: chat-crm-mysql-data
  chat-crm-redis-data:
    name: chat-crm-redis-data
  chat-crm-uploads-data:
    name: chat-crm-uploads-data

networks:
  chat-crm-network:
    name: chat-crm-network
    driver: bridge
