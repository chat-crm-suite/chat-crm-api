# Ejemplo OPCIONAL: compose global si quieres un solo `up` desde ~/Proyectos/CRM/
# NO commiteado como compose real. Si lo usas, colócalo manualmente en el servidor como
# ~/Proyectos/CRM/docker-compose.yml y ajusta build contexts.
# Recomendado actual: usar los 3 composes separados (ya comparten `crm-network` por nombre).
name: crm-prod
services:
  api:
    build:
      context: ./chat-crm-api
      dockerfile: Dockerfile
      target: production
    container_name: nestjs-app
    env_file:
      - ./chat-crm-api/.env.prod
    environment:
      - NODE_ENV=production
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "3000:3000"
    networks:
      - crm-network
      - nestjs-network
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: nestjs-mysql
    env_file:
      - ./chat-crm-api/.env.prod
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - nestjs-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: nestjs-redis
    networks:
      - nestjs-network
    restart: unless-stopped

  ia:
    build:
      context: ./chat-crm-ia
      dockerfile: Dockerfile
      target: production
    container_name: chat-crm-ia
    ports:
      - "8000:8000"
    networks:
      - crm-network
    restart: unless-stopped

  front:
    build:
      context: ./chat-crm-app
      dockerfile: Dockerfile
      target: production
      args:
        VITE_API_URL: http://<SERVER_IP>:3000
        VITE_SOCKET_URL: http://<SERVER_IP>:3000
    container_name: chat-crm-app-prod
    ports:
      - "8081:80"
    networks:
      - crm-network
    restart: unless-stopped

volumes:
  mysql_data:
  uploads_data:

networks:
  crm-network:
    name: crm-network
    driver: bridge
  nestjs-network:
    driver: bridge
