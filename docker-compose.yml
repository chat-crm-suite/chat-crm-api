# USO INDIVIDUAL (solo API + MySQL/Redis/phpMyAdmin) - no es el stack del día a día.
# El stack completo (API + front + IA + infra en una orden) vive en la raíz:
#   ../../docker-compose.dev.yml   ->  docker compose -f ../../docker-compose.dev.yml up --build -d
#
# Arranque individual:
#   docker compose up --build -d            # usa este .env del repo para interpolación
#   docker compose down
#   curl -s http://localhost:3000/health
#
# El env de la API sale de `env_file: .env` (TODAS las claves: DB_*, REDIS_*, JWT_SECRET,
# CORS_ORIGIN, IA_URL, WHATSAPP_*, bootstrap). Sin env_file el contenedor no ve JWT_SECRET
# ni CORS y el login/cookies fallan en silencio.
# El frontend en este modo sigue siendo `npm run dev` local o el compose de chat-crm-app.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: chat-crm-dev-api
    env_file:
      - .env
    environment:
      - NODE_ENV=development
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    volumes:
      - .:/app
      # Volumen con nombre: sobrevive a `down` (con anónimo cada down = npm ci otra vez).
      - api_node_modules:/app/node_modules
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - chat-crm-dev-net
    restart: unless-stopped
    command: ["npm", "run", "start:dev"]

  mysql:
    image: mysql:8.0
    container_name: chat-crm-dev-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password}
      MYSQL_DATABASE: ${DB_DATABASE:-chat_crm_db}
      MYSQL_USER: ${DB_USERNAME:-nestjs_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-password}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d
    networks:
      - chat-crm-dev-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      timeout: 20s
      retries: 10
      interval: 10s
      start_period: 40s

  redis:
    image: redis:7-alpine
    container_name: chat-crm-dev-redis
    ports:
      - "6379:6379"
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    networks:
      - chat-crm-dev-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "if [ -z \"$$REDIS_PASSWORD\" ]; then redis-cli ping | grep PONG; else redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG; fi"]
      timeout: 3s
      retries: 5
      interval: 10s
      start_period: 10s
    command: >
      sh -c "
      if [ -n \"$$REDIS_PASSWORD\" ]; then
        redis-server --requirepass $$REDIS_PASSWORD --appendonly yes
      else
        redis-server --appendonly yes
      fi
      "

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: chat-crm-dev-phpmyadmin
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: ${DB_USERNAME:-root}
      PMA_PASSWORD: ${DB_PASSWORD:-password}
    depends_on:
      - mysql
    networks:
      - chat-crm-dev-net
    restart: unless-stopped

# Volúmenes persistentes
volumes:
  api_node_modules:
    driver: local
  mysql_data:
    driver: local
  redis_data:
    driver: local

# Red de este proyecto (el nombre final lo escapa compose con el nombre del proyecto,
# por eso no colisiona con el stack global 'chat-crm-dev').
networks:
  chat-crm-dev-net:
    driver: bridge
